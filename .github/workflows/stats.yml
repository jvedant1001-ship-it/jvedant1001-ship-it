name: Update GitHub Stats

on:
  schedule:
    # Refresh every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Deny everything by default.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    # Required only because this workflow commits generated SVGs.
    permissions:
      contents: write

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated statistics
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update GitHub statistics"
          add: "profile/"
